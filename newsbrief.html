<header class="top"><div class="brandBlock"><div class="brand" aria-label="NewsBrief, 홈으로 이동"><svg class="brandIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9a1 1 0 0 0 1 1h11a1 1 0 0 0 1-1v-9"/><path d="M9.5 20v-6h5v6"/></svg><span class="brand-news">News</span><span class="brand-brief">Brief</span></div><div class="tagline">오늘의 뉴스를 3줄로 정리해, 판단을 가볍게.<br>중요한 기사만 저장하고 미래의 나에게 남기세요.</div></div><div class="accountBar"><a class="accountLink" id="adminLink" href="/admin" hidden>계정 관리</a><span class="accountName" id="accountName"></span><span class="accountDivider" aria-hidden="true">·</span><button class="logoutButton" id="logoutButton" type="button">로그아웃</button></div><div class="controls"><div class="sectionBar"><button class="sectionPill baduk" data-section="baduk">바둑</button><button class="sectionPill" data-section="general">일반</button></div><div class="subnavWrap" id="subNav"></div><div class="filterbar" id="categories"></div><form class="searchbar" id="search"><input id="query" aria-label="뉴스 검색"><button>검색</button></form></div></header>
<section class="issuePanel" id="issuesPanel" aria-labelledby="issuesTitle"><div class="issueHead"><div><div class="issueTitle" id="issuesTitle">일간 이슈 키워드</div><div class="issueDesc" id="issuesDesc"></div></div></div><div class="issueGrid" id="issues"></div></section>
<div class="sectionTitle" id="sectionTitle">일간 뉴스 요약</div><main class="grid" id="cards"><div class="empty">뉴스를 불러오는 중입니다.</div></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
const cats=['정치','경제','사회','생활/문화','세계'];
const state={section:'baduk',genView:'daily',badukView:'daily',category:'',q:'',issueKey:'',items:[],issueItems:[],requestSeq:0};
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// 일간 헤드라인 타일용: 코너명 대괄호("[특파원]")나 말줄임표처럼 짧은
// "키워드"로 보이는 걸 방해하는 꼬리표만 정리한다. AI 없이 정규식으로만.
const cleanHeadline=v=>String(v||'')
  .replace(/^\s*(?:\[[^[\]]{1,20}\]|<[^<>]{1,20}>)\s*/,'')
  .replace(/\s*(?:\[[^[\]]{1,20}\]|\([^()]{1,20}\))\s*$/,'')
  .replace(/[…]+\s*$/,'')
  .trim();
const RESPONSE_CACHE_PREFIX='newsbrief_response_v2:';
const VIEW_CACHE_TTL=300000,viewCache=new Map(),viewRequests=new Map();let viewCacheGeneration=0;
let activeLoadController=null,lastSuccessfulLoad=0;
fetch('/api/auth/me').then(r=>r.ok?r.json():null).then(me=>{if(!me)return;$('accountName').textContent=me.username||'';if(me?.admin)$('adminLink').hidden=false}).catch(()=>{});
const parseTime=v=>new Date(/^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}$/.test(String(v||''))?`${v.replace(' ','T')}Z`:v);
const sortByArticleTime=items=>[...(items||[])].sort((a,b)=>{
  const right=+parseTime(b.published_at||'');
  const left=+parseTime(a.published_at||'');
  return (Number.isFinite(right)?right:0)-(Number.isFinite(left)?left:0);
});
const fmt=v=>{const raw=String(v||'');if(/^\d{4}-\d{2}-\d{2}$/.test(raw)){const [,m,d]=raw.split('-');return`${Number(m)}. ${Number(d)}.`}const time=parseTime(raw);return Number.isNaN(+time)?'':new Intl.DateTimeFormat('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}).format(time)};
const relTime=ms=>{
  const min=Math.max(0,Math.floor((Date.now()-ms)/60000));
  if(min<1)return'방금';
  if(min<60)return`${min}분 전`;
  const hr=Math.floor(min/60),rem=min%60;
  if(hr<24)return rem?`${hr}시간 ${rem}분 전`:`${hr}시간 전`;
  return`${Math.floor(hr/24)}일 전`;
};
let toastTimer;
function toast(message){clearTimeout(toastTimer);$('toast').textContent=message;$('toast').classList.add('show');toastTimer=setTimeout(()=>$('toast').classList.remove('show'),1800)}
$('logoutButton').addEventListener('click',async()=>{
  if(!confirm('로그아웃할까요?'))return;
  const button=$('logoutButton');button.disabled=true;
  try{
    const response=await fetch('/api/auth/logout',{method:'POST'});
    if(!response.ok)throw Error('로그아웃 실패');
    clearResponseCache();
    location.replace('/login?next=%2F');
  }catch{button.disabled=false;toast('로그아웃하지 못했습니다. 다시 시도해 주세요.')}
});
async function fetchTimed(url,options={},timeout=12000){
  const timeoutController=new AbortController(),timer=setTimeout(()=>timeoutController.abort(),timeout);
  const signal=options.signal&&globalThis.AbortSignal?.any?AbortSignal.any([options.signal,timeoutController.signal]):(options.signal||timeoutController.signal);
  try{return await fetch(url,{...options,signal})}finally{clearTimeout(timer)}
}
async function fetchJson(url,options){
  const config={...(options||{}),headers:{...(options?.headers||{})}};
  const isGet=(config.method||'GET').toUpperCase()==='GET';
  const attempts=isGet?4:1;
  const cacheKey=`${RESPONSE_CACHE_PREFIX}${url}`;
  let lastError;
  for(let attempt=0;attempt<attempts;attempt+=1){
    try{
      const response=await fetchTimed(url,config,15000);
      if(response.status===401||(response.redirected&&new URL(response.url).pathname==='/login')){
        const next=encodeURIComponent(location.pathname+location.search+location.hash);
        location.replace(`/login?next=${next}`);
        throw Object.assign(Error('로그인이 필요합니다.'),{name:'AuthRequiredError'});
      }
      const type=(response.headers.get('content-type')||'').toLowerCase();
      const isJson=type.includes('application/json');
      let data=null;
      if(isJson){try{data=await response.json()}catch{lastError=Error('서버 JSON 응답을 읽지 못했습니다.')}}
      if(response.ok&&data){if(isGet)try{sessionStorage.setItem(cacheKey,JSON.stringify(data))}catch{}return data}
      const message=data?.error||(isJson?'뉴스를 불러오지 못했습니다.':'서버가 일시적으로 비정상 응답을 보냈습니다.');
      const retryable=isGet&&(!isJson||response.status===408||response.status===425||response.status===429||response.status>=500);
      if(!retryable)throw Error(message);
      lastError=Error(message);
    }catch(error){if(error?.name==='AuthRequiredError'||(error?.name==='AbortError'&&config.signal?.aborted))throw error;lastError=error}
    if(attempt<attempts-1)await new Promise(resolve=>setTimeout(resolve,400*2**attempt+Math.random()*250));
  }
  if(isGet){try{const cached=JSON.parse(sessionStorage.getItem(cacheKey)||'null');if(cached){console.warn('NewsBrief API fallback',url);return cached}}catch{}}
  throw Error(lastError?.name==='AbortError'?'서버 응답이 지연되고 있습니다. 다시 시도해 주세요.':'서버 연결이 불안정합니다. 잠시 후 다시 시도해 주세요.');
}
async function fetchViewJson(url,options){
  const cached=viewCache.get(url);
  if(cached&&Date.now()-cached.savedAt<VIEW_CACHE_TTL)return cached.data;
  if(viewRequests.has(url))return viewRequests.get(url);
  const generation=viewCacheGeneration;
  const request=fetchJson(url,options).then(data=>{if(generation===viewCacheGeneration)viewCache.set(url,{data,savedAt:Date.now()});return data});
  if(options?.signal)return request;
  viewRequests.set(url,request);
  try{return await request}finally{viewRequests.delete(url)}
}
function clearResponseCache(){viewCacheGeneration+=1;viewCache.clear();viewRequests.clear();for(let i=sessionStorage.length-1;i>=0;i-=1){const key=sessionStorage.key(i);if(key?.startsWith(RESPONSE_CACHE_PREFIX))sessionStorage.removeItem(key)}}
const SUBVIEWS={
  general:[['daily','일간'],['weekly','주간'],['monthly','월간'],['saved','저장']],
  baduk:[['daily','일간'],['weekly','주간'],['monthly','월간'],['saved','저장']]
};
function currentSubview(){return state.section==='baduk'?state.badukView:state.genView}
function setSubview(value){if(state.section==='baduk')state.badukView=value;else state.genView=value}
function issueUrl(issueKey=''){
  const url=new URL(location.href);
  ['section','view','issue'].forEach(key=>url.searchParams.delete(key));
  if(issueKey){url.searchParams.set('section',state.section);url.searchParams.set('view',currentSubview());url.searchParams.set('issue',issueKey)}
  return `${url.pathname}${url.search}${url.hash}`;
}
function resetIssueUrl(){if(new URL(location.href).searchParams.has('issue'))history.replaceState(null,'',issueUrl())}
function resetIssueSelectionUi(){
  state.issueKey='';
  if(document.activeElement instanceof HTMLElement)document.activeElement.blur();
  render();
}
function restoreLocation(historyState=null){
  const params=new URLSearchParams(location.search);
  const section=params.get('section')||historyState?.section;
  const view=params.get('view')||historyState?.view;
  const issue=params.get('issue')||'';
  if(section==='baduk'||section==='general')state.section=section;
  if(view==='daily'||view==='weekly'||view==='monthly')setSubview(view);
  state.category='';state.q='';state.issueKey=issue;$('query').value='';
  if(!issue)resetIssueSelectionUi();
  return load().then(()=>{if(issue)return;requestAnimationFrame(()=>{if(Number.isFinite(historyState?.scrollY))window.scrollTo({top:historyState.scrollY,behavior:'auto'});else $('issuesPanel')?.scrollIntoView({behavior:'smooth',block:'start'})})});
}
function openIssue(issueKey){
  history.replaceState({newsbriefSource:true,section:state.section,view:currentSubview(),scrollY:window.scrollY},'',location.href);
  history.pushState({newsbriefIssue:true,section:state.section,view:currentSubview()},'',issueUrl(issueKey));
  state.issueKey=issueKey;load();
}
function closeIssue(){
  if(history.state?.newsbriefIssue){resetIssueSelectionUi();history.back();return}
  resetIssueSelectionUi();history.replaceState({newsbriefSource:true,section:state.section,view:currentSubview()},'',issueUrl());
  load().then(()=>$('issuesPanel')?.scrollIntoView({behavior:'smooth',block:'start'}));
}
function nav(){
  document.querySelectorAll('[data-section]').forEach(b=>b.classList.toggle('on',b.dataset.section===state.section));
  const sub=currentSubview();
  $('subNav').innerHTML=SUBVIEWS[state.section].map(([value,label])=>`<button class="pill ${sub===value?'on':''}" data-subview="${value}">${label}</button>`).join('');
  const show=state.section==='general'&&(sub==='daily'||sub==='weekly'||sub==='monthly');
  $('categories').style.display=show?'flex':'none';
  $('categories').innerHTML=show?cats.map(c=>`<button class="pill ${state.category===c?'on':''}" data-cat="${c}">${c}</button>`).join(''):'';
}
function renderIssues(){
  const sub=currentSubview();
  const show=Boolean(state.issueItems.length)&&!state.q&&(sub==='daily'||!state.category)&&sub!=='saved';
  $('issuesPanel').style.display=show?'block':'none';
  if(!show)return;
  const jumpMode=sub==='daily';
  $('issuesTitle').textContent=jumpMode?'일간 최신 헤드라인':sub==='weekly'?'주간 이슈 키워드':'월간 이슈 키워드';
  $('issuesDesc').textContent='';
  $('issues').className=jumpMode?'hotpage':'issueGrid';
  $('issues').innerHTML=jumpMode
    ? state.issueItems.map((issue,i)=>{
        const isNew=issue.latest&&Date.now()-+parseTime(issue.latest)<10800000;
        return `<a class="hotchip" href="#article-${esc(issue.key)}" data-scroll-key="${esc(issue.key)}"><span class="hotrank">${String(i+1).padStart(2,'0')}</span><span class="hottext">${isNew?'<span class="issueNew">NEW</span> ':''}${esc(issue.title)}</span>${issue.count>1?`<span class="hotrelated">관련 ${issue.count}건</span>`:''}<span aria-hidden="true">↓</span></a>`;
      }).join('')||'<div class="empty">아직 기사가 없습니다.</div>'
    : state.issueItems.map(issue=>{
        const selected=state.issueKey===issue.key;
        const isNew=issue.latest&&Date.now()-+parseTime(issue.latest)<86400000;
        return `<button type="button" class="issueCard ${selected?'on':''}" data-issue-key="${esc(issue.key)}" aria-pressed="${selected?'true':'false'}"><div class="issueName">${isNew?'<span class="issueNew">NEW</span>':''}<span>${esc(issue.title)}</span></div><div class="issueMeta"><span>${selected?'선택됨 · ':''}관련 기사 ${issue.count}건</span><span class="issueView"><span class="issueViewDesktop">· 전체 카드 보기 </span><span class="issueViewMobile">전체보기 </span><span class="issueArrow" aria-hidden="true">↓</span></span></div></button>`;
      }).join('')||'<div class="issueEmpty">아직 식별된 이슈가 없습니다.</div>';
}
function relatedHtml(item){
  if(!item.related_count)return'';
  return `<details class="related"><summary>관련 보도 ${item.related_count}건</summary><div class="related-list">${item.related.map(x=>`<a class="related-link" href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.outlet)} · ${esc(x.title)}</a>`).join('')}</div></details>`;
}
function cardHtml(x){
  const isNew=Date.now()-+parseTime(x.published_at||x.fetched_at||'')<(currentSubview()==='daily'?10800000:86400000);
  const actions=`<button class="act ${x.saved?'on':''}" data-action="${x.saved?'unsave':'save'}">${x.saved?'저장됨':'저장'}</button><button class="act del" data-action="hide">삭제</button>`;
  return `<article class="card ${x.category==='바둑'?'cat-baduk':''}" id="article-${esc(x.url_key)}" data-key="${esc(x.url_key)}"><div class="meta"><div class="meta-left">${isNew?'<span class="tagNew">NEW</span>':''}<span class="tag" title="${esc(x.outlet||x.press||x.source)}">${esc(x.outlet||x.press||x.source)}</span><span class="tag">${esc(x.category)}</span></div><span class="time">${esc(fmt(x.published_at))}</span></div><div class="row"><a class="thumb" href="${esc(x.url)}" target="_blank" rel="noopener"><img src="/api/news/image?key=${encodeURIComponent(x.url_key)}" alt="" loading="lazy" onerror="this.remove()"></a><div class="content"><a class="title" href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.title)}</a><div class="sum">${String(x.summary||'').split('\n').map(s=>`<div class="sline">${esc(s)}</div>`).join('')}</div>${relatedHtml(x)}</div></div><div class="actions">${actions}</div></article>`;
}
function render(){
  nav();renderIssues();
  const sub=currentSubview();
  const periodLabels={daily:['일간 뉴스 요약',''],weekly:['주간 뉴스 요약',''],monthly:['월간 뉴스 요약','']};
  const savedLabel=state.section==='baduk'?['저장한 바둑 뉴스','']:['저장한 뉴스',''];
  const base=sub==='saved'?savedLabel:(periodLabels[sub]||['뉴스','']);
  const selectedIssue=state.issueKey?state.issueItems.find(i=>i.key===state.issueKey):null;
  const categoryPeriod=sub==='daily'?'일간':sub==='weekly'?'주간':sub==='monthly'?'월간':'';
  const label=selectedIssue?[selectedIssue.title,'']:(state.section==='general'&&state.category?[`${categoryPeriod} ${state.category} 3줄 요약`.trim(),'']:base);
  $('sectionTitle').innerHTML=selectedIssue?`<button type="button" class="issueBack" id="issueBack" aria-label="이전 화면으로">←</button><span class="issueCurrentTitle">${esc(label[0])}</span>`:`${esc(label[0])}${label[1]?`<span class="sectionDesc">${esc(label[1])}</span>`:''}`;
  $('cards').innerHTML=state.items.length?state.items.map(cardHtml).join(''):'<div class="empty">조건에 맞는 뉴스가 없습니다.</div>';
}
async function load({silent=false}={}){
  activeLoadController?.abort();
  const loadController=new AbortController();activeLoadController=loadController;
  const requestId=++state.requestSeq;nav();
  const sub=currentSubview();
  const hasVisibleData=state.items.length>0;
  if(!silent&&!hasVisibleData){$('cards').innerHTML='<div class="empty">뉴스를 불러오는 중입니다.</div>';$('issuesPanel').style.display='none'}
  const isBaduk=state.section==='baduk';
  try{
    // 일반은 일간·주간·월간 모두 포털 인기뉴스만 사용한다. 인기 기록이
    // 아직 일주일 남짓이면 주간과 월간이 비슷할 수 있지만, 일반 기사
    // 전체를 임의로 섞어 기간 차이를 만들지는 않는다.
    const p=new URLSearchParams({limit:isBaduk?'120':'150',view:sub==='saved'?'saved':(isBaduk?'latest':'popular')});
    if(isBaduk){
      p.set('category','바둑');
    }else{
      p.set('exclude_baduk','1');
      if(state.category)p.set('category',state.category);
    }
    if(sub==='daily')p.set('hours','24');
    else if(sub==='weekly')p.set('hours','168');
    else if(sub==='monthly')p.set('hours','720');
    if(state.q)p.set('q',state.q);
    if(state.issueKey)p.set('issue_key',state.issueKey);
    // 일간은 하루 한 번만 도는 AI 이슈 분류 캐시를 안 탄다 - 최대 거의
    // 하루치 시차가 나서 방금 들어온 기사와 어긋나 보일 수 있다. 대신
    // 방금 받은 기사 목록에서 바로 타일을 만드니 캐시비용도, 어긋날
    // 일도 없다 (아래 daily 분기 참고).
    if(sub!=='saved'&&sub!=='daily'&&!state.category)p.set('issues','1');
    const detailUrl=`/api/news/articles?${p}`;
    let d,indexData=null;
    if(state.issueKey&&!state.issueItems.length){
      const indexParams=new URLSearchParams(p);indexParams.delete('issue_key');
      [d,indexData]=await Promise.all([fetchViewJson(detailUrl,{signal:loadController.signal}),fetchViewJson(`/api/news/articles?${indexParams}`,{signal:loadController.signal})]);
    }else d=await fetchViewJson(detailUrl,{signal:loadController.signal});
    if(requestId!==state.requestSeq)return;
    state.items=isBaduk?(d.items||[]):sortByArticleTime(d.items);
    if(sub==='daily'){
      state.issueItems=state.items.slice(0,12).map(x=>({key:x.url_key,title:cleanHeadline(x.title)||x.title,count:(x.related_count||0)+1,latest:x.published_at||x.fetched_at,jump:true}));
    }else if(indexData)state.issueItems=indexData.issues||[];else if(!state.issueKey)state.issueItems=d.issues||[];
    lastSuccessfulLoad=Date.now();
    // A cached issue tile can outlive the articles behind it (the AI issue
    // cache and the stricter per-card display validation run separately and
    // can fall out of sync), leaving a keyword tile whose click silently
    // returns zero cards. Surface that instead of doing nothing, and drop the
    // dead tile so it stops being clickable.
    if(state.issueKey&&!state.items.length){
      const deadKey=state.issueKey;
      state.issueItems=state.issueItems.filter(i=>i.key!==deadKey);
      state.issueKey='';
      resetIssueUrl();
      render();
      toast('해당 이슈의 기사를 더 이상 표시할 수 없어 목록에서 제거했습니다.');
    }else{
      render();
      if(state.issueKey){requestAnimationFrame(()=>{const card=$('cards').querySelector('.card');if(card){card.classList.add('issue-focus');card.scrollIntoView({behavior:'smooth',block:'center'});setTimeout(()=>card.classList.remove('issue-focus'),3200)}})}
    }
  }
  catch(e){if(e?.name!=='AbortError'&&e?.name!=='AuthRequiredError'&&requestId===state.requestSeq&&!silent){if(hasVisibleData){render();toast('새 소식을 가져오지 못해 이전 내용을 표시합니다.')}else $('cards').innerHTML=`<div class="empty">${esc(e.message||'불러오기 실패')}<br><button class="pill" id="retryLoad" type="button">다시 시도</button></div>`}}
  finally{if(activeLoadController===loadController)activeLoadController=null}
}
document.addEventListener('click',e=>{
  const scroll=e.target.closest('[data-scroll-key]');
  if(scroll){e.preventDefault();const card=document.getElementById(`article-${scroll.dataset.scrollKey}`);if(card){card.classList.add('issue-focus');card.scrollIntoView({behavior:'smooth',block:'center'});setTimeout(()=>card.classList.remove('issue-focus'),3200)}return}
  if(e.target.closest('#issueBack')){closeIssue();return}
  if(e.target.closest('.brand')){setSubview('daily');state.category='';state.q='';state.issueKey='';$('query').value='';resetIssueUrl();load();return}
  if(e.target.closest('#retryLoad')){load();return}
  const issue=e.target.closest('[data-issue-key]');
  if(issue){
    openIssue(issue.dataset.issueKey);
    return;
  }
  const section=e.target.dataset.section;
  if(section){state.section=section;state.category='';state.q='';state.issueKey='';$('query').value='';resetIssueUrl();load();return}
  const subview=e.target.dataset.subview;
  if(subview){setSubview(subview);state.category='';state.q='';state.issueKey='';$('query').value='';resetIssueUrl();load();return}
  const category=e.target.dataset.cat;
  if(category){state.category=category;state.issueKey='';resetIssueUrl();load()}
});
$('cards').addEventListener('click',async e=>{
  const action=e.target.dataset.action;if(!action)return;
  const button=e.target,card=button.closest('.card'),key=card.dataset.key;
  if(action==='hide'&&!confirm('이 기사를 삭제하시겠습니까?'))return;
  button.disabled=true;
  try{
    const item=state.items.find(x=>x.url_key===key);
    const urlKeys=action==='hide'&&item?[key,...(item.related||[]).map(x=>x.url_key)]:[key];
    const r=await fetchTimed('/api/news/item',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action,url_key:key,url_keys:urlKeys})});
    const result=await r.json().catch(()=>null);
    if(!r.ok)throw Error();
    clearResponseCache();
    if(action==='save'&&item){item.saved=1;button.dataset.action='unsave';button.textContent='저장됨';button.classList.add('on');button.disabled=false;toast('기사를 저장했습니다.');return}
    if(action==='unsave'&&currentSubview()!=='saved'&&item){item.saved=0;button.dataset.action='save';button.textContent='저장';button.classList.remove('on');button.disabled=false;toast('저장을 해제했습니다.');return}
    card.classList.add('removing');setTimeout(()=>{state.items=state.items.filter(x=>x.url_key!==key);card.remove();if(!$('cards').querySelector('.card'))render()},180);toast(action==='hide'?(result?.affected>1?`같은 뉴스 ${result.affected}건을 삭제했습니다.`:'기사를 삭제했습니다.'):'저장을 해제했습니다.');
  }catch{button.disabled=false;toast('처리하지 못했습니다. 다시 시도해 주세요.')}
});
$('search').onsubmit=e=>{e.preventDefault();state.q=$('query').value.trim();state.issueKey='';resetIssueUrl();load()};
addEventListener('popstate',e=>restoreLocation(e.state));
const initialParams=new URLSearchParams(location.search),initialSection=initialParams.get('section'),initialView=initialParams.get('view');
if(initialSection==='baduk'||initialSection==='general')state.section=initialSection;
if(initialView==='daily'||initialView==='weekly'||initialView==='monthly')setSubview(initialView);
state.issueKey=initialParams.get('issue')||'';nav();load();
// Recheck visible data every ten minutes; the collector and five-minute cache
// keep this lightweight while making newly collected articles appear promptly.
setInterval(()=>load({silent:true}),600000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&Date.now()-lastSuccessfulLoad>300000)load({silent:true})});
</script></body></html>
