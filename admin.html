<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NewsBrief 계정 관리</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--text:#111827;--muted:#6b7280;--line:#e5e7eb;--go:#0f766e;--danger:#dc2626}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:ui-sans-serif,system-ui,-apple-system,"Noto Sans KR",sans-serif}.wrap{width:min(880px,calc(100% - 28px));margin:36px auto}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:20px}.brand{font-size:22px;font-weight:950}.brand span{color:var(--go)}a{color:var(--go);font-weight:750;text-decoration:none}.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 12px 28px rgba(16,24,40,.06)}h1{font-size:20px;margin:0 0 6px}.desc,.count{color:var(--muted);font-size:13px}.usage{display:grid;grid-template-columns:1fr auto;gap:8px 14px;margin:18px 0 4px;padding:14px;border:1px solid var(--line);border-radius:13px;background:#f8fafc}.usageTitle{font-weight:850}.usageValue{font-weight:850;color:var(--go)}.usageMeta,.usageNote{grid-column:1/-1;color:var(--muted);font-size:12px}.usage.warning{border-color:#fbbf24;background:#fffbeb}.usage.warning .usageValue{color:#b45309}.usage.danger{border-color:#fca5a5;background:#fef2f2}.usage.danger .usageValue{color:var(--danger)}.create{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;margin:22px 0}input{min-width:0;padding:11px 12px;border:1px solid #d1d5db;border-radius:11px;font-size:14px}button{border:0;border-radius:10px;padding:10px 14px;background:#111827;color:#fff;font-weight:750;cursor:pointer}button:disabled{opacity:.55;cursor:wait}.list{display:grid;gap:9px}.user{display:grid;grid-template-columns:minmax(120px,1fr) auto auto auto;align-items:center;gap:8px;padding:12px;border:1px solid var(--line);border-radius:13px}.name{font-weight:800}.badge{font-size:11px;color:var(--go);margin-left:6px}.change{background:#475569}.delete{background:#fff;color:var(--danger);border:1px solid #fecaca}.msg{min-height:20px;margin-top:12px;font-size:13px}.msg.error{color:var(--danger)}@media(max-width:600px){.wrap{margin:20px auto}.panel{padding:16px}.create{grid-template-columns:1fr}.create button{width:100%}.user{grid-template-columns:1fr 1fr}.name{grid-column:1/-1}.user button{width:100%}}
</style>
</head>
<body><main class="wrap"><div class="top"><div class="brand">News<span>Brief</span></div><a href="/">뉴스로 돌아가기</a></div><section class="panel"><h1>계정 관리</h1><div class="desc">아이디는 영문 소문자로 입력하세요. 변경사항은 즉시 적용됩니다.</div><div class="count" id="count"></div><div class="usage" id="usage"><div class="usageTitle">무료 DB 저장공간</div><div class="usageValue" id="usageValue">확인 중</div><div class="usageMeta" id="usageMeta"></div><div class="usageNote">70%부터 자동 운영 경고가 발생합니다. 하루 요청·읽기·쓰기 한도는 Cloudflare 계정 전체 지표라 대시보드에서 확인해야 합니다.</div></div><form class="create" id="create"><input id="newUser" autocomplete="off" placeholder="새 아이디" pattern="[a-z0-9._\-]{3,32}" required><input id="newPassword" type="password" autocomplete="new-password" placeholder="비밀번호 4자 이상" minlength="4" maxlength="64" required><button>계정 추가</button></form><div class="list" id="list"></div><div class="msg" id="msg"></div></section></main>
<script>
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let users=[],admin='';
function message(text,error=false){$('msg').textContent=text;$('msg').className=`msg${error?' error':''}`}
async function api(options){const r=await fetch('/api/admin/users',options);const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'요청을 처리하지 못했습니다.');return d}
const formatBytes=value=>value===null?'측정 불가':value<1048576?`${(value/1024).toFixed(1)}KB`:`${(value/1048576).toFixed(1)}MB`;
async function loadUsage(){try{const r=await fetch('/api/admin/usage'),d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||'사용량 확인 실패');$('usage').className=`usage ${d.storage.level}`;$('usageValue').textContent=d.storage.percent===null?'측정 불가':`${d.storage.percent}%`;$('usageMeta').textContent=`${formatBytes(d.storage.bytes)} / ${formatBytes(d.storage.limit_bytes)} · 저장 ${d.records.saved.toLocaleString()}개 · 삭제 ${d.records.hidden.toLocaleString()}개`}catch(e){$('usageValue').textContent='확인 실패';$('usageMeta').textContent=e.message;$('usage').className='usage warning'}}
function render(data){users=data.users||[];$('count').textContent=`현재 ${data.count}개 / 최대 ${data.max_users}개`;$('list').innerHTML=users.map(user=>`<div class="user" data-user="${esc(user.username)}"><div class="name">${esc(user.username)}${user.role==='admin'?'<span class="badge">관리자</span>':''}</div>${user.role==='admin'?'':'<button class="change" data-action="rename">아이디 변경</button>'}<button class="change" data-action="password">비밀번호 변경</button>${user.role==='admin'?'<span></span>':'<button class="delete" data-action="delete">삭제</button>'}</div>`).join('')}
async function load(){try{render(await api());await loadUsage()}catch(e){if(/권한/.test(e.message)){location.replace('/')}else message(e.message,true)}}
$('create').addEventListener('submit',async e=>{e.preventDefault();const button=e.submitter;button.disabled=true;try{await api({method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:'create',username:$('newUser').value.trim(),password:$('newPassword').value})});e.target.reset();message('계정을 추가했습니다.');await load()}catch(err){message(err.message,true)}finally{button.disabled=false}});
$('list').addEventListener('click',async e=>{const button=e.target.closest('button');if(!button)return;const row=button.closest('.user'),oldUsername=row.dataset.user,action=button.dataset.action;let username=oldUsername,password='';if(action==='rename'){username=(prompt(`${oldUsername}의 새 아이디를 입력하세요.`)||'').trim();if(!username)return;password=prompt('새 아이디에서 사용할 비밀번호를 입력하세요.')||'';if(!password)return}else if(action==='password'){password=prompt(`${oldUsername}의 새 비밀번호를 입력하세요.`)||'';if(!password)return}else if(!confirm(`${oldUsername} 계정과 저장·삭제 기록을 모두 삭제할까요?`))return;button.disabled=true;try{await api({method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action,old_username:oldUsername,username,password})});message(action==='delete'?'계정과 저장·삭제 기록을 삭제했습니다.':action==='rename'?'아이디와 저장 데이터를 변경했습니다.':'비밀번호를 변경했습니다.');await load()}catch(err){message(err.message,true)}finally{button.disabled=false}});
load();
</script></body></html>
