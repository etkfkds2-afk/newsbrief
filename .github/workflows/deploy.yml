name: Deploy to Cloudflare Pages

permissions:
  contents: read
  issues: write

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      backfill:
        description: '최근 한 달 백필과 바둑 요약 복구 실행'
        required: false
        default: false
        type: boolean
      classify_category:
        description: 'Claude로 이슈 키워드 재분류할 카테고리 (비우면 건너뜀)'
        required: false
        default: ''
        type: choice
        options: ['', '바둑', '일반']
      reset_issues:
        description: '선택한 카테고리 이슈 캐시를 비우고 처음부터 재분류'
        required: false
        default: false
        type: boolean
      general_boost:
        description: '이번 실행만 일반 인기뉴스 Claude 한도를 24회로 보강'
        required: false
        default: false
        type: boolean
      repair_popularity:
        description: '최근 7일 네이버 인기 랭킹과 누락 기사 복구'
        required: false
        default: false
        type: boolean
      repair_times:
        description: '날짜만 남은 일반기사 원문 발행시각 복구'
        required: false
        default: false
        type: boolean
      repair_categories:
        description: '최근 일반기사의 네이버 원문 섹션 기준 카테고리 복구'
        required: false
        default: false
        type: boolean
      repair_general_quality:
        description: '낮은 품질의 일반 요약 격리 후 AI 재요약'
        required: false
        default: false
        type: boolean
  schedule:
    # GitHub may delay scheduled jobs during busy periods. Running every 15
    # Collect and refresh all news views every three hours. URL keys in D1 make
    # each collection idempotent, so a slower cadence avoids needless requests.
    - cron: '17 */3 * * *'
    # An hourly watchdog only collects when the last automatic run is over four
    # hours old. The offset avoids GitHub's busiest top-of-hour scheduler window.
    - cron: '47 * * * *'
    # Update baduk issues daily. General issues run only on Sunday UTC
    # (Monday morning in Korea) to keep Claude spending low.
    - cron: '23 21 * * *'

jobs:
  deploy:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare static site
        run: |
          rm -rf dist
          mkdir dist
          cp newsbrief.html dist/index.html
          cp newsbrief.html dist/newsbrief.html

      - name: Ensure Cloudflare Pages project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          status=$(curl -sS -o /tmp/pages-project.json -w '%{http_code}' \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/af27f3bbca2209ff9cb2c77a2e47184a/pages/projects/newsbrief-etkfkds2")
          if [ "$status" = "404" ]; then
            curl --fail-with-body -sS \
              -X POST \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              --data '{"name":"newsbrief-etkfkds2","production_branch":"main"}' \
              "https://api.cloudflare.com/client/v4/accounts/af27f3bbca2209ff9cb2c77a2e47184a/pages/projects"
          elif [ "$status" != "200" ]; then
            cat /tmp/pages-project.json
            exit 1
          fi

      - name: Configure NewsBrief runtime secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          NEWSBRIEF_COLLECT_TOKEN: ${{ secrets.NEWSBRIEF_COLLECT_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          jq -n \
            --arg naver_id "$NAVER_CLIENT_ID" \
            --arg naver_secret "$NAVER_CLIENT_SECRET" \
            --arg kakao_key "$KAKAO_REST_API_KEY" \
            --arg collect_token "$NEWSBRIEF_COLLECT_TOKEN" \
            --arg anthropic_key "$ANTHROPIC_API_KEY" \
            '{deployment_configs:{production:{env_vars:{
              NAVER_CLIENT_ID:{type:"secret_text",value:$naver_id},
              NAVER_CLIENT_SECRET:{type:"secret_text",value:$naver_secret},
              KAKAO_REST_API_KEY:{type:"secret_text",value:$kakao_key},
              NEWSBRIEF_COLLECT_TOKEN:{type:"secret_text",value:$collect_token},
              ANTHROPIC_API_KEY:{type:"secret_text",value:$anthropic_key},
              NEWSBRIEF_USE_ANTHROPIC:{type:"plain_text",value:"0"}
            }}}}' > /tmp/pages-settings.json
          curl --fail-with-body -sS \
            -X PATCH \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data @/tmp/pages-settings.json \
            "https://api.cloudflare.com/client/v4/accounts/af27f3bbca2209ff9cb2c77a2e47184a/pages/projects/newsbrief-etkfkds2" \
            > /tmp/pages-settings-response.json

      - uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: af27f3bbca2209ff9cb2c77a2e47184a
          projectName: newsbrief-etkfkds2
          directory: dist
          branch: main

  collect-news:
    needs: deploy
    if: >-
      always() &&
      ((github.event_name == 'schedule' && (github.event.schedule == '17 */3 * * *' || github.event.schedule == '47 * * * *')) ||
       github.event_name == 'workflow_dispatch')
    concurrency:
      group: newsbrief-collector
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Decide whether collection is due
        id: collection-gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          should_collect=true
          run_source=manual
          if [ "$EVENT_NAME" = "schedule" ]; then
            run_source=scheduled
            if [ "$EVENT_SCHEDULE" = "47 * * * *" ]; then
              run_source=watchdog
              health=$(curl -sS --retry 2 --max-time 30 "https://newsbrief-etkfkds2.pages.dev/api/news/health" || printf '{}')
              should_collect=$(echo "$health" | jq -r '((.metrics.automatic_age_hours // 999) > 4)')
            fi
          fi
          echo "should_collect=$should_collect" >> "$GITHUB_OUTPUT"
          echo "run_source=$run_source" >> "$GITHUB_OUTPUT"

      - name: Discover Google News and trigger collection
        if: >-
          steps.collection-gate.outputs.should_collect == 'true' &&
          (github.event_name != 'workflow_dispatch' ||
          (!inputs.repair_popularity && !inputs.repair_times && !inputs.repair_categories && !inputs.repair_general_quality))
        env:
          NEWSBRIEF_COLLECT_TOKEN: ${{ secrets.NEWSBRIEF_COLLECT_TOKEN }}
          NEWSBRIEF_BACKFILL: ${{ github.event_name == 'workflow_dispatch' && inputs.backfill && '1' || '0' }}
          NEWSBRIEF_GENERAL_BOOST: ${{ github.event_name == 'workflow_dispatch' && inputs.general_boost && '1' || '0' }}
          NEWSBRIEF_RUN_SOURCE: ${{ steps.collection-gate.outputs.run_source }}
        run: node scripts/google-news-discovery.mjs

      - name: Trigger NewsBrief collection
        if: steps.collection-gate.outputs.should_collect == 'true'
        env:
          NEWSBRIEF_COLLECT_TOKEN: ${{ secrets.NEWSBRIEF_COLLECT_TOKEN }}
        run: |
          runs=0
          # Backfills use more small requests instead of a few large requests so
          # each Pages Worker invocation stays below its CPU time limit.
          if [ "${{ inputs.backfill }}" = "true" ]; then runs=18; fi
          for i in $(seq 1 "$runs"); do
            endpoint="https://newsbrief-etkfkds2.pages.dev/api/news/collect?source=manual"
            if [ "${{ inputs.backfill }}" = "true" ]; then endpoint="${endpoint}&backfill=1&force_retry=1"; fi
            if [ "${{ inputs.general_boost }}" = "true" ]; then endpoint="${endpoint}&general_boost=1"; fi
            curl --fail-with-body --retry 3 --max-time 240 \
              -X POST \
              -H "Authorization: Bearer ${NEWSBRIEF_COLLECT_TOKEN}" \
              "$endpoint"
            sleep 3
          done
          if [ "${{ inputs.backfill }}" = "true" ]; then
            for i in $(seq 1 10); do
              curl --fail-with-body --retry 3 --max-time 240 \
                -X POST \
                -H "Authorization: Bearer ${NEWSBRIEF_COLLECT_TOKEN}" \
                "https://newsbrief-etkfkds2.pages.dev/api/news/collect?repair=1&force_retry=1"
              sleep 3
            done
          fi
          if [ "${{ inputs.repair_popularity }}" = "true" ]; then
            for offset in $(seq 0 6); do
              ymd=$(date -u -d "${offset} day ago" +%Y%m%d)
              for batch_offset in 0 4 8; do
                curl --fail-with-body --retry 3 --max-time 120 \
                  -X POST \
                  -H "Authorization: Bearer ${NEWSBRIEF_COLLECT_TOKEN}" \
                  "https://newsbrief-etkfkds2.pages.dev/api/news/collect?popularity_date=${ymd}&popularity_offset=${batch_offset}"
                sleep 3
              done
            done
          fi
          if [ "${{ inputs.repair_times }}" = "true" ]; then
            for i in $(seq 1 8); do
              curl --fail-with-body --retry 3 --max-time 120 \
                -X POST \
                -H "Authorization: Bearer ${NEWSBRIEF_COLLECT_TOKEN}" \
                "https://newsbrief-etkfkds2.pages.dev/api/news/collect?repair_times=1"
            done
          fi
          if [ "${{ inputs.repair_categories }}" = "true" ]; then
            for i in $(seq 1 30); do
              response=$(curl --fail-with-body --retry 3 --max-time 120 \
                -X POST \
                -H "Authorization: Bearer ${NEWSBRIEF_COLLECT_TOKEN}" \
                "https://newsbrief-etkfkds2.pages.dev/api/news/collect?repair_categories=1")
              echo "$response"
              if echo "$response" | jq -e '.category_repair.done == true' >/dev/null; then break; fi
            done
          fi
          if [ "${{ inputs.repair_general_quality }}" = "true" ]; then
            curl --fail-with-body --retry 3 --max-time 240 \
              -X POST \
              -H "Authorization: Bearer ${NEWSBRIEF_COLLECT_TOKEN}" \
              "https://newsbrief-etkfkds2.pages.dev/api/news/collect?repair_general_quality=1"
          fi

  classify-issues:
    needs: deploy
    if: >-
      always() &&
      ((github.event_name == 'workflow_dispatch' && inputs.classify_category != '') ||
       (github.event_name == 'schedule' && github.event.schedule == '23 21 * * *'))
    runs-on: ubuntu-latest
    steps:
      - name: Classify issue keywords with remaining Workers AI or Claude
        env:
          NEWSBRIEF_COLLECT_TOKEN: ${{ secrets.NEWSBRIEF_COLLECT_TOKEN }}
          CLASSIFY_CATEGORY: ${{ inputs.classify_category }}
          RESET_ISSUES: ${{ inputs.reset_issues }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            categories=("바둑")
            if [ "$(date -u +%u)" = "7" ]; then categories+=("일반"); fi
          else
            categories=("${CLASSIFY_CATEGORY}")
          fi
          for category in "${categories[@]}"; do
            encoded=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))" "${category}")
            output="/tmp/classify-${encoded}.json"
            reset_query=""
            if [ "${RESET_ISSUES}" = "true" ]; then reset_query="&reset=1"; fi
            curl --fail-with-body -sS --retry 2 --max-time 120 \
              -X POST \
              -H "Authorization: Bearer ${NEWSBRIEF_COLLECT_TOKEN}" \
              "https://newsbrief-etkfkds2.pages.dev/api/news/classify-issues?category=${encoded}${reset_query}" \
              | tee "${output}"
            echo
            python3 -m json.tool "${output}"
          done

  health-check:
    needs: [collect-news, classify-issues]
    if: always() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Check NewsBrief production health
        id: health
        run: |
          set +e
          status=$(curl -sS -o /tmp/newsbrief-health.json -w '%{http_code}' \
            --retry 3 --max-time 30 \
            "https://newsbrief-etkfkds2.pages.dev/api/news/health")
          curl_exit=$?
          set -e
          if [ "$curl_exit" != "0" ]; then
            printf '{"ok":false,"failures":["health_endpoint_unreachable"],"curl_exit":%s}\n' "$curl_exit" > /tmp/newsbrief-health.json
            status="000"
          fi
          cat /tmp/newsbrief-health.json
          if [ "$status" != "200" ]; then
            echo "unhealthy=true" >> "$GITHUB_OUTPUT"
          else
            echo "unhealthy=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update health alert issue
        if: steps.health.outputs.unhealthy == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="NewsBrief 자동 운영 경고"
          issue=$(gh issue list --state open --search "${title} in:title" --json number --jq '.[0].number // empty')
          body="$(date -u '+%Y-%m-%d %H:%M:%S UTC') 자동 건강 점검 실패

          실행: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          $(cat /tmp/newsbrief-health.json)"
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
          exit 1
