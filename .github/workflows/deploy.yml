name: Deploy to Cloudflare Pages

permissions:
  contents: read
  deployments: write
  issues: write

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      backfill:
        description: '최근 한 달 백필과 바둑 요약 복구 실행'
        required: false
        default: false
        type: boolean
      baduk_now:
        description: '바둑만 지금 강제로 수집·요약 (하루 호출 상한 무시, 3패스)'
        required: false
        default: false
        type: boolean
      classify_category:
        description: 'Claude로 이슈 키워드 재분류할 카테고리 (비우면 건너뜀)'
        required: false
        default: ''
        type: choice
        options: ['', '바둑', '일반']
      reset_issues:
        description: '선택한 카테고리 이슈 캐시를 비우고 처음부터 재분류'
        required: false
        default: false
        type: boolean
      rollback_issues:
        description: '선택한 카테고리의 직전 이슈 캐시로 즉시 복원'
        required: false
        default: false
        type: boolean
      free_issue_ai:
        description: '수동 이슈 분류에 비용 없는 Cloudflare AI만 사용'
        required: false
        default: false
        type: boolean
      regroup_issues:
        description: '기존 이슈 제목은 유지하고 기사 소속만 다시 분류'
        required: false
        default: false
        type: boolean
      general_boost:
        description: '이번 실행만 일반 인기뉴스 Claude 한도를 24회로 보강'
        required: false
        default: false
        type: boolean
      repair_popularity:
        description: '최근 7일 네이버 인기 랭킹과 누락 기사 복구'
        required: false
        default: false
        type: boolean
      repair_times:
        description: '날짜만 남은 일반기사 원문 발행시각 복구'
        required: false
        default: false
        type: boolean
      repair_categories:
        description: '최근 일반기사의 원문 섹션 기준 카테고리 복구'
        required: false
        default: false
        type: boolean
      reset_categories:
        description: '카테고리 복구 시 이전에 확인한 기사도 전부 다시 검사'
        required: false
        default: false
        type: boolean
      repair_general_quality:
        description: '낮은 품질의 일반 요약 격리 후 AI 재요약'
        required: false
        default: false
        type: boolean
      repair_titles:
        description: '잘려 저장된 바둑기사 제목을 원문 제목으로 복구'
        required: false
        default: false
        type: boolean
  schedule:
    # GitHub may delay or occasionally drop scheduled runs during busy
    # periods (observed firsthand: gaps of several hours with no trigger at
    # all, especially on days with many manual/push-triggered runs). Collect
    # and refresh all news views every three hours; URL keys in D1 make each
    # collection idempotent, so a slower cadence avoids needless requests.
    - cron: '17 */3 * * *'
    # 워치독은 GitHub이 예약 실행을 통째로 흘렸을 때를 위한 안전망이다. 매시
    # 돌렸더니 하루 24회로 Actions 분량의 대부분을 먹었다 - 비공개 저장소의 무료
    # 분량은 월 2,000분인데, 예약만 하루 33회라 이번 달에 결국 한도에 걸려
    # 2026-08-14 03:32부터 모든 실행이 시작조차 못 했다("The job was not started
    # because ... spending limit"). 그 시각부터 수집이 통째로 멈췄다.
    #
    # 수집이 3시간마다(:17)이므로 워치독도 3시간마다 돌리되 90분 뒤로 어긋나게
    # 둔다. 흘린 실행을 최대 90분 안에 메우므로 안전망 역할은 그대로이고,
    # 실행 횟수는 24회에서 8회로 줄어든다.
    - cron: '47 1-23/3 * * *'
    # Classify issue keywords for both categories daily (baduk first, then
    # general - see classify-issues job). Haiku (not Sonnet) keeps this cheap
    # enough to run general daily too instead of only on Sundays.
    - cron: '23 21 * * *'

jobs:
  deploy:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate required deployment secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          NEWSBRIEF_COLLECT_TOKEN: ${{ secrets.NEWSBRIEF_COLLECT_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NEWSBRIEF_SITE_USER: ${{ secrets.NEWSBRIEF_SITE_USER }}
          NEWSBRIEF_SITE_PASSWORD: ${{ secrets.NEWSBRIEF_SITE_PASSWORD }}
          NEWSBRIEF_SITE_USERS: ${{ secrets.NEWSBRIEF_SITE_USERS }}
          NEWSBRIEF_SESSION_SECRET: ${{ secrets.NEWSBRIEF_SESSION_SECRET }}
        run: |
          missing=0
          for name in CLOUDFLARE_API_TOKEN NAVER_CLIENT_ID NAVER_CLIENT_SECRET KAKAO_REST_API_KEY NEWSBRIEF_COLLECT_TOKEN ANTHROPIC_API_KEY NEWSBRIEF_SITE_USER NEWSBRIEF_SITE_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Required secret ${name} is missing; production settings were not changed."
              missing=1
            fi
          done
          if [ "$missing" = "1" ]; then exit 1; fi

      - name: Prepare static site
        run: |
          rm -rf dist
          mkdir dist
          cp newsbrief.html dist/index.html
          cp newsbrief.html dist/newsbrief.html
          cp login.html dist/login.html
          cp admin.html dist/admin.html

      - name: Ensure Cloudflare Pages project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          status=$(curl -sS -o /tmp/pages-project.json -w '%{http_code}' \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/af27f3bbca2209ff9cb2c77a2e47184a/pages/projects/newsbrief-etkfkds2")
          if [ "$status" = "404" ]; then
            curl --fail-with-body -sS \
              -X POST \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              --data '{"name":"newsbrief-etkfkds2","production_branch":"main"}' \
              "https://api.cloudflare.com/client/v4/accounts/af27f3bbca2209ff9cb2c77a2e47184a/pages/projects"
          elif [ "$status" != "200" ]; then
            cat /tmp/pages-project.json
            exit 1
          fi

      - name: Configure NewsBrief runtime secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          NEWSBRIEF_COLLECT_TOKEN: ${{ secrets.NEWSBRIEF_COLLECT_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NEWSBRIEF_SITE_USER: ${{ secrets.NEWSBRIEF_SITE_USER }}
          NEWSBRIEF_SITE_PASSWORD: ${{ secrets.NEWSBRIEF_SITE_PASSWORD }}
          NEWSBRIEF_SITE_USERS: ${{ secrets.NEWSBRIEF_SITE_USERS }}
          NEWSBRIEF_SESSION_SECRET: ${{ secrets.NEWSBRIEF_SESSION_SECRET }}
        run: |
          jq -n \
            --arg naver_id "$NAVER_CLIENT_ID" \
            --arg naver_secret "$NAVER_CLIENT_SECRET" \
            --arg kakao_key "$KAKAO_REST_API_KEY" \
            --arg collect_token "$NEWSBRIEF_COLLECT_TOKEN" \
            --arg anthropic_key "$ANTHROPIC_API_KEY" \
            --arg site_user "$NEWSBRIEF_SITE_USER" \
            --arg site_password "$NEWSBRIEF_SITE_PASSWORD" \
            --arg site_users "$NEWSBRIEF_SITE_USERS" \
            --arg session_secret "$NEWSBRIEF_SESSION_SECRET" \
            '({
              NAVER_CLIENT_ID:{type:"secret_text",value:$naver_id},
              NAVER_CLIENT_SECRET:{type:"secret_text",value:$naver_secret},
              KAKAO_REST_API_KEY:{type:"secret_text",value:$kakao_key},
              NEWSBRIEF_COLLECT_TOKEN:{type:"secret_text",value:$collect_token},
              ANTHROPIC_API_KEY:{type:"secret_text",value:$anthropic_key},
              NEWSBRIEF_SITE_USER:{type:"secret_text",value:$site_user},
              NEWSBRIEF_SITE_PASSWORD:{type:"secret_text",value:$site_password},
              NEWSBRIEF_USE_ANTHROPIC:{type:"plain_text",value:"0"}
            }
            + (if $site_users == "" then {} else {NEWSBRIEF_SITE_USERS:{type:"secret_text",value:$site_users}} end)
            + (if $session_secret == "" then {} else {NEWSBRIEF_SESSION_SECRET:{type:"secret_text",value:$session_secret}} end))
            | {deployment_configs:{production:{env_vars:.}}}' > /tmp/pages-settings.json
          curl --fail-with-body -sS \
            -X PATCH \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data @/tmp/pages-settings.json \
            "https://api.cloudflare.com/client/v4/accounts/af27f3bbca2209ff9cb2c77a2e47184a/pages/projects/newsbrief-etkfkds2" \
            > /tmp/pages-settings-response.json

      - name: Deploy to Cloudflare Pages with supported Wrangler action
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: af27f3bbca2209ff9cb2c77a2e47184a
          command: pages deploy dist --project-name=newsbrief-etkfkds2 --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

  collect-news:
    needs: deploy
    if: >-
      always() &&
      ((github.event_name == 'schedule' && (github.event.schedule == '17 */3 * * *' || github.event.schedule == '47 1-23/3 * * *')) ||
       github.event_name == 'workflow_dispatch')
    concurrency:
      group: newsbrief-collector
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Decide whether collection is due
        id: collection-gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          should_collect=true
          run_source=manual
          if [ "$EVENT_NAME" = "schedule" ]; then
            run_source=scheduled
            if [ "$EVENT_SCHEDULE" = "47 1-23/3 * * *" ]; then
              run_source=watchdog
              # curl can print one 503 body per retry. jq then emits several
              # booleans, which corrupts GITHUB_OUTPUT on the following line.
              # Keep only the final decision and fail open if health is unreachable.
              health=$(curl -sS --retry 2 --max-time 30 "https://newsbrief-etkfkds2.pages.dev/api/news/health" || true)
              should_collect=$(printf '%s' "$health" | jq -r '((.metrics.automatic_age_hours // 999) > 4)' | tail -n 1)
              should_collect=${should_collect:-true}
            fi
          fi
          echo "should_collect=$should_collect" >> "$GITHUB_OUTPUT"
          echo "run_source=$run_source" >> "$GITHUB_OUTPUT"

      - name: Discover Google News and trigger collection
        if: >-
          steps.collection-gate.outputs.should_collect == 'true' &&
          !inputs.rollback_issues &&
          !inputs.regroup_issues &&
          (github.event_name != 'workflow_dispatch' ||
          (!inputs.repair_popularity && !inputs.repair_times && !inputs.repair_categories && !inputs.repair_general_quality && !inputs.repair_titles))
        env:
          NEWSBRIEF_COLLECT_TOKEN: ${{ secrets.NEWSBRIEF_COLLECT_TOKEN }}
          NEWSBRIEF_BACKFILL: ${{ github.event_name == 'workflow_dispatch' && inputs.backfill && '1' || '0' }}
          NEWSBRIEF_GENERAL_BOOST: ${{ github.event_name == 'workflow_dispatch' && inputs.general_boost && '1' || '0' }}
          NEWSBRIEF_RUN_SOURCE: ${{ steps.collection-gate.outputs.run_source }}
        run: node scripts/google-news-discovery.mjs

      # A plain run already got one collection call from the previous step -
      # google-news-discovery.mjs POSTs to /api/news/collect itself. Each
      # Pages Worker invocation gets its own fresh Cloudflare subrequest
      # budget (free plan: 50 per invocation) that resets per call, not per
      # day, so one extra plain call here roughly doubles how many
      # candidates can actually get their article body fetched this cycle
      # without needing a paid plan. Idempotent url_key storage makes the
      # repeat call safe - already-published items are skipped instantly.
      - name: Trigger NewsBrief collection
        if: steps.collection-gate.outputs.should_collect == 'true'
        env:
          NEWSBRIEF_COLLECT_TOKEN: ${{ secrets.NEWSBRIEF_COLLECT_TOKEN }}
        run: |
          runs=1
          # Backfills use more small requests instead of a few large requests so
          # each Pages Worker invocation stays below its CPU time limit.
          if [ "${{ inputs.backfill }}" = "true" ]; then runs=18; fi
          for i in $(seq 1 "$runs"); do
            endpoint="https://newsbrief-etkfkds2.pages.dev/api/news/collect?source=manual"
            if [ "${{ inputs.backfill }}" = "true" ]; then endpoint="${endpoint}&backfill=1&force_retry=1"; fi
            if [ "${{ inputs.general_boost }}" = "true" ]; then endpoint="${endpoint}&general_boost=1"; fi
            curl --fail-with-body --retry 3 --max-time 240 \
              -X POST \
              -H "Authorization: Bearer ${NEWSBRIEF_COLLECT_TOKEN}" \
              "$endpoint"
            sleep 3
          done
          # 바둑 전용 호출. 위 호출들은 일반을 먼저 처리하고 남은 subrequest로
          # 바둑 본문을 가져오는데 그 예산이 매번 바닥났다 (실측 2026-08-10:
          # 바둑 본문 실패 7건 중 6건이 "Too many subrequests", 같은 실행에서
          # 일반은 발행 가능한 후보가 22건 남아돌았다). 순서를 되돌리면 이번엔
          # 일반이 굶으므로 - 지금 순서가 그래서 생겼다 - 바둑에 자기 호출을 준다.
          # 호출마다 subrequest 예산이 새로 주어지는 것이 이 방식이 통하는 이유다.
          #
          # 이 curl은 두 번째 패스다. 첫 패스는 google-news-discovery.mjs가
          # 디스커버리 헤드라인을 실어 직접 POST한다 - 이 curl은 본문을 못 실어서
          # googleDiscoveries가 늘 빈 배열이었고, 그래서 가장 좋은 후보 목록이
          # 정작 바둑 전용 호출에는 한 번도 가지 않았다(2026-08-11 실측).
          # 둘 다 남겨 둔다: 수집 커서(rotation_cursor)가 호출마다 올라가므로 두
          # 패스는 서로 다른 회전 검색어를 쓰고, url_key가 같은 기사는 D1에서
          # 즉시 걸러지므로 겹치는 비용은 거의 없다.
          if [ "${{ inputs.backfill }}" != "true" ]; then
            curl --fail-with-body --retry 3 --max-time 240 \
              -X POST \
              -H "Authorization: Bearer ${NEWSBRIEF_COLLECT_TOKEN}" \
              "https://newsbrief-etkfkds2.pages.dev/api/news/collect?source=manual&baduk_only=1"
            sleep 3
          fi
          # 바둑만 지금 당장 채워야 할 때 쓰는 손잡이. 하루 호출 상한이 이미 찼는데
          # 바둑 화면이 비어 있는 상황을 사람이 직접 푸는 용도다(force_retry가 상한을
          # 200으로 올린다).
          #
          # 백필로는 이걸 못 한다. 백필은 "최근 한 달"을 긁는 경로라 가져온 기사가
          # 며칠~한 달 전 것이고, 24시간 화면에는 원래 안 뜬다. 2026-08-14에 그걸
          # 모르고 백필을 두 번 돌려 $0.06을 쓰고 바둑은 0건 그대로였다.
          #
          # 3패스로 묶어 둔다. 실행당 요약 상한이 있어 최악의 경우에도 예상 지출이
          # $0.3 안팎이다. 자동 경로(schedule/push)에서는 절대 켜지지 않는다 -
          # 정기 실행이 이걸 필요로 한다면 그건 몫 배분이 틀린 것이고, 그때 고칠
          # 곳은 이 버튼이 아니라 BADUK_RESERVED_ANTHROPIC_CALLS다.
          if [ "${{ inputs.baduk_now }}" = "true" ]; then
            for i in $(seq 1 3); do
              curl --fail-with-body --retry 3 --max-time 240 \
                -X POST \
                -H "Authorization: Bearer ${NEWSBRIEF_COLLECT_TOKEN}" \
                "https://newsbrief-etkfkds2.pages.dev/api/news/collect?source=manual&baduk_only=1&force_retry=1"
              sleep 3
            done
          fi
          if [ "${{ inputs.backfill }}" = "true" ]; then
            for i in $(seq 1 10); do
              curl --fail-with-body --retry 3 --max-time 240 \
                -X POST \
                -H "Authorization: Bearer ${NEWSBRIEF_COLLECT_TOKEN}" \
                "https://newsbrief-etkfkds2.pages.dev/api/news/collect?repair=1&force_retry=1"
              sleep 3
            done
          fi
          if [ "${{ inputs.repair_popularity }}" = "true" ]; then
            for offset in $(seq 0 6); do
              ymd=$(date -u -d "${offset} day ago" +%Y%m%d)
              for batch_offset in 0 4 8; do
                curl --fail-with-body --retry 3 --max-time 120 \
                  -X POST \
                  -H "Authorization: Bearer ${NEWSBRIEF_COLLECT_TOKEN}" \
                  "https://newsbrief-etkfkds2.pages.dev/api/news/collect?popularity_date=${ymd}&popularity_offset=${batch_offset}"
                sleep 3
              done
            done
          fi
          if [ "${{ inputs.repair_times }}" = "true" ]; then
            for i in $(seq 1 8); do
              curl --fail-with-body --retry 3 --max-time 120 \
                -X POST \
                -H "Authorization: Bearer ${NEWSBRIEF_COLLECT_TOKEN}" \
                "https://newsbrief-etkfkds2.pages.dev/api/news/collect?repair_times=1"
            done
          fi
          if [ "${{ inputs.repair_categories }}" = "true" ]; then
            for i in $(seq 1 30); do
              endpoint="https://newsbrief-etkfkds2.pages.dev/api/news/collect?repair_categories=1"
              if [ "$i" = "1" ] && [ "${{ inputs.reset_categories }}" = "true" ]; then endpoint="${endpoint}&reset_categories=1"; fi
              response=$(curl --fail-with-body --retry 3 --max-time 120 \
                -X POST \
                -H "Authorization: Bearer ${NEWSBRIEF_COLLECT_TOKEN}" \
                "$endpoint")
              echo "$response"
              if echo "$response" | jq -e '.category_repair.done == true' >/dev/null; then break; fi
            done
          fi
          if [ "${{ inputs.repair_general_quality }}" = "true" ]; then
            curl --fail-with-body --retry 3 --max-time 240 \
              -X POST \
              -H "Authorization: Bearer ${NEWSBRIEF_COLLECT_TOKEN}" \
              "https://newsbrief-etkfkds2.pages.dev/api/news/collect?repair_general_quality=1"
          fi
          # Walk every baduk article of the last 30 days, ten per call, and
          # restore any title the old cleanTitle truncated at a space-less
          # hyphen. The first call resets the cursor so a dispatch always
          # sweeps from the start; each call only lengthens a title that the
          # stored one is still a prefix of, so repeating it is harmless.
          if [ "${{ inputs.repair_titles }}" = "true" ]; then
            for i in $(seq 1 40); do
              endpoint="https://newsbrief-etkfkds2.pages.dev/api/news/collect?repair_titles=1"
              if [ "$i" = "1" ]; then endpoint="${endpoint}&reset=1"; fi
              response=$(curl --fail-with-body --retry 3 --max-time 120 \
                -X POST \
                -H "Authorization: Bearer ${NEWSBRIEF_COLLECT_TOKEN}" \
                "$endpoint")
              echo "$response"
              if echo "$response" | jq -e '.title_repair.done == true' >/dev/null; then break; fi
              sleep 2
            done
          fi

  classify-issues:
    needs: deploy
    if: >-
      always() &&
      ((github.event_name == 'workflow_dispatch' && inputs.classify_category != '') ||
       (github.event_name == 'schedule' && github.event.schedule == '23 21 * * *'))
    runs-on: ubuntu-latest
    steps:
      - name: Classify issue keywords with remaining Workers AI or Claude
        env:
          NEWSBRIEF_COLLECT_TOKEN: ${{ secrets.NEWSBRIEF_COLLECT_TOKEN }}
          CLASSIFY_CATEGORY: ${{ inputs.classify_category }}
          RESET_ISSUES: ${{ inputs.reset_issues }}
          ROLLBACK_ISSUES: ${{ inputs.rollback_issues }}
          FREE_ISSUE_AI: ${{ inputs.free_issue_ai }}
          REGROUP_ISSUES: ${{ inputs.regroup_issues }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            # Baduk always classified first. Both run daily now that Haiku
            # (not Sonnet) makes issue classification cheap enough.
            categories=("바둑" "일반")
          else
            categories=("${CLASSIFY_CATEGORY}")
          fi
          for category in "${categories[@]}"; do
            encoded=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))" "${category}")
            output="/tmp/classify-${encoded}.json"
            reset_query=""
            if [ "${RESET_ISSUES}" = "true" ]; then reset_query="&reset=1"; fi
            if [ "${ROLLBACK_ISSUES}" = "true" ]; then reset_query="&rollback=1"; fi
            if [ "${FREE_ISSUE_AI}" = "true" ]; then reset_query="${reset_query}&free=1"; fi
            if [ "${REGROUP_ISSUES}" = "true" ]; then reset_query="${reset_query}&regroup=1"; fi
            # 240초. 정기 분류는 새 기사만 보내서 금방 끝나지만, regroup은 그
            # 카테고리 기사를 통째로 다시 보내므로 프롬프트가 훨씬 크다. 실측
            # 2026-08-10: 일반 regroup이 120초에서 세 번 연속 타임아웃으로 실패했다.
            # 수집 호출과 같은 값으로 맞춘다.
            # 재시도하지 않는다. 타임아웃은 호출이 실패했다는 뜻이 아니라 응답이
            # 늦다는 뜻일 뿐이고, Worker 쪽 AI 호출은 그대로 끝까지 돌아간다.
            # 그 상태에서 재시도하면 같은 분류를 돈 내고 여러 번 사면서, 응답을
            # 못 받은 실행은 recordClaudeUsage까지 못 가 예산에 기록도 안 된다.
            # 2026-08-10 실측: 재시도 3회로 실제 $0.91을 쓰고 $0.041만 기록됐다.
            curl --fail-with-body -sS --no-keepalive --max-time 240 \
              -X POST \
              -H "Authorization: Bearer ${NEWSBRIEF_COLLECT_TOKEN}" \
              "https://newsbrief-etkfkds2.pages.dev/api/news/classify-issues?category=${encoded}${reset_query}" \
              | tee "${output}"
            echo
            python3 -m json.tool "${output}"
          done

  health-check:
    needs: [collect-news, classify-issues]
    # 예약이 뜰 때마다 돌리면 하루 33회다. 건강 점검은 수집 직후에 보는 것이
    # 의미가 있고, 워치독은 어차피 자기 게이트에서 health를 직접 읽는다.
    # 수집 예약에서만 돌려 하루 8회로 줄인다.
    if: always() && github.event_name == 'schedule' && github.event.schedule == '17 */3 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Check NewsBrief production health
        id: health
        env:
          NEWSBRIEF_SITE_USER: ${{ secrets.NEWSBRIEF_SITE_USER }}
          NEWSBRIEF_SITE_PASSWORD: ${{ secrets.NEWSBRIEF_SITE_PASSWORD }}
        run: |
          set +e
          status=$(curl -sS -o /tmp/newsbrief-health.json -w '%{http_code}' \
            --retry 3 --max-time 30 \
            "https://newsbrief-etkfkds2.pages.dev/api/news/health")
          curl_exit=$?
          set -e
          if [ "$curl_exit" != "0" ]; then
            printf '{"ok":false,"failures":["health_endpoint_unreachable"],"curl_exit":%s}\n' "$curl_exit" > /tmp/newsbrief-health.json
            status="000"
          fi
          cat /tmp/newsbrief-health.json
          health_ok=$(jq -r '.ok // false' /tmp/newsbrief-health.json 2>/dev/null || printf 'false')
          feed_ok=false
          login_status=$(curl -sS --max-time 30 -c /tmp/newsbrief-health-cookie \
            -o /tmp/newsbrief-login-check.json -w '%{http_code}' \
            -H 'content-type: application/json' \
            --data "$(jq -cn --arg username "$NEWSBRIEF_SITE_USER" --arg password "$NEWSBRIEF_SITE_PASSWORD" '{username:$username,password:$password}')" \
            "https://newsbrief-etkfkds2.pages.dev/api/auth/login" || true)
          if [ "$login_status" = "200" ]; then
            weekly_status=$(curl -sS --max-time 30 -b /tmp/newsbrief-health-cookie -o /tmp/newsbrief-weekly-check.json -w '%{http_code}' \
              "https://newsbrief-etkfkds2.pages.dev/api/news/articles?limit=150&view=popular&exclude_baduk=1&hours=168&issues=1" || true)
            monthly_status=$(curl -sS --max-time 30 -b /tmp/newsbrief-health-cookie -o /tmp/newsbrief-monthly-check.json -w '%{http_code}' \
              "https://newsbrief-etkfkds2.pages.dev/api/news/articles?limit=150&view=popular&exclude_baduk=1&hours=720&issues=1" || true)
            # 바둑 탭도 확인한다. 예전에는 일반 탭 두 개만 봤다 - 바둑이 이
            # 서비스의 메인인데 그 화면이 깨져도 알림이 안 갔다. 건수는 묻지
            # 않는다(한국기원이 2~4일에 한 번 올려 조용한 날이 정상이다).
            # 화면이 실제로 쓰는 조건 그대로 부른다.
            baduk_status=$(curl -sS --max-time 30 -b /tmp/newsbrief-health-cookie -o /tmp/newsbrief-baduk-check.json -w '%{http_code}' \
              "https://newsbrief-etkfkds2.pages.dev/api/news/articles?limit=120&view=latest&category=%EB%B0%94%EB%91%91&hours=24" || true)
            if [ "$weekly_status" = "200" ] && [ "$monthly_status" = "200" ] && [ "$baduk_status" = "200" ] \
              && jq -e '.ok == true' /tmp/newsbrief-weekly-check.json >/dev/null \
              && jq -e '.ok == true' /tmp/newsbrief-monthly-check.json >/dev/null \
              && jq -e '.ok == true' /tmp/newsbrief-baduk-check.json >/dev/null; then
              feed_ok=true
            fi
          fi
          if [ "$status" != "200" ] || [ "$health_ok" != "true" ] || [ "$feed_ok" != "true" ]; then
            echo "unhealthy=true" >> "$GITHUB_OUTPUT"
          else
            echo "unhealthy=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Report health failure only when it changes
        if: steps.health.outputs.unhealthy == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # This job has no actions/checkout step, so gh's git-based repo
          # detection fails ("not a git repository") - every one of these
          # commands was erroring out instead of ever filing an alert.
          # --repo makes it explicit and skips that detection entirely.
          #
          # 예전에는 실패할 때마다 같은 이슈에 댓글을 달았다. 실측 2026-08-11:
          # 이슈 #3이 7월 30일부터 열린 채 댓글 177개가 쌓여 있었다. 3시간마다
          # 한 통씩, 12일간 같은 제목의 메일이 갔다는 뜻이다. 그러면 사람이
          # 알람을 통째로 무시하게 되고 - 실제로 그렇게 됐다 - 정작 새로 생긴
          # 고장은 사용자가 화면을 보고 발견하게 된다.
          #
          # 그래서 **실패 목록이 달라졌을 때만** 알린다. 같은 고장이 이어지는
          # 동안은 이슈가 열려 있는 것 자체가 신호이고, 새 메일은 보내지 않는다.
          title="NewsBrief 자동 운영 경고"
          signature=$(jq -r '(.failures // ["unknown"]) | sort | join(",")' /tmp/newsbrief-health.json 2>/dev/null || printf 'unknown')
          issue=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "${title} in:title" --json number --jq '.[0].number // empty')
          body="$(date -u '+%Y-%m-%d %H:%M:%S UTC') 자동 건강 점검 실패

          실패 항목: ${signature}
          실행: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          $(cat /tmp/newsbrief-health.json)

          <!-- failures-signature: ${signature} -->"
          if [ -z "$issue" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
            exit 1
          fi
          # 직전에 알린 실패 목록과 같으면 조용히 둔다. 이슈는 계속 열려 있다.
          previous=$(gh issue view "$issue" --repo "$GITHUB_REPOSITORY" --json body,comments \
            --jq '([.body] + [.comments[].body]) | last' \
            | sed -n 's/.*failures-signature: \([^ ]*\).*/\1/p' | tail -n 1)
          if [ "$signature" = "$previous" ]; then
            echo "::notice::같은 실패가 이어지는 중(${signature}). 이슈 #${issue}는 열려 있으므로 새 알림은 보내지 않는다."
            exit 0
          fi
          gh issue comment "$issue" --repo "$GITHUB_REPOSITORY" --body "$body"
          exit 1

      # 회복되면 이슈를 닫는다. 예전에는 닫는 로직이 아예 없어서, 고쳐도 경고가
      # 열린 채로 남았다. 그 상태가 길어질수록 "저건 원래 켜져 있는 것"이 되고
      # 알람이 죽는다. 닫혀 있어야 다음에 새로 열릴 때 신호가 된다.
      - name: Close health alert issue on recovery
        if: steps.health.outputs.unhealthy == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="NewsBrief 자동 운영 경고"
          issue=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "${title} in:title" --json number --jq '.[0].number // empty')
          if [ -z "$issue" ]; then exit 0; fi
          gh issue close "$issue" --repo "$GITHUB_REPOSITORY" \
            --comment "$(date -u '+%Y-%m-%d %H:%M:%S UTC') 자동 건강 점검 통과. 회복으로 보고 닫는다.

          실행: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
