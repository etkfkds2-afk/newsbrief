name: One-time NewsBrief DB recovery

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Restore D1 to pre-classification state
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          account_id='af27f3bbca2209ff9cb2c77a2e47184a'
          project='newsbrief-etkfkds2'
          project_json=$(curl --fail-with-body -sS \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${account_id}/pages/projects/${project}")
          database_id=$(printf '%s' "$project_json" | jq -r '.result.deployment_configs.production.d1_databases.DB.id // empty')
          test -n "$database_id"
          response=$(curl -sS \
            -X POST \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data '{"timestamp":"2026-07-28T12:59:00Z"}' \
            "https://api.cloudflare.com/client/v4/accounts/${account_id}/d1/database/${database_id}/time_travel/restore")
          printf '%s' "$response" | jq '{success, errors, result}'
          printf '%s' "$response" | jq -e '.success == true and .result.bookmark != null'
